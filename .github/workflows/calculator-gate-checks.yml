name: Calculator Gate Checks

on:
  push:
    branches: [feat/calculator-gate]
  pull_request:
    paths:
      - 'submodules/TelegramUI/Sources/CalculatorGate/**'
      - 'submodules/TelegramUI/Sources/AppDelegate.swift'
      - 'submodules/AuthorizationUI/Sources/AuthorizationSequencePaymentScreen.swift'
      - 'submodules/AuthorizationUI/Sources/AuthorizationSequencePhoneEntryController.swift'
      - 'submodules/AuthorizationUI/Sources/AuthorizationSequenceCodeEntryController.swift'
      - 'submodules/AuthorizationUI/Sources/AuthorizationSequenceController.swift'
      - 'submodules/TelegramIntents/Sources/TelegramIntents.swift'
      - 'submodules/TelegramCallsUI/Sources/CallKitIntegration.swift'
      - 'submodules/InAppPurchaseManager/Sources/InAppPurchaseManager.swift'
      - 'submodules/BotPaymentsUI/Sources/BotCheckoutControllerNode.swift'
      - 'submodules/TelegramCore/Sources/Authorization.swift'
      - 'submodules/TelegramCore/Sources/Account/Account.swift'
      - 'submodules/TelegramCore/Sources/Account/AccountManager.swift'
      - 'submodules/TelegramCore/Sources/TelegramEngine/Auth/AuthTransfer.swift'
      - 'submodules/SettingsUI/Sources/Privacy and Security/LoginEmailSetupController.swift'
      - 'submodules/TelegramUI/Components/Settings/PasskeysScreen/Sources/PasskeysScreen.swift'
      - 'Tests/CalculatorGate/**'
      - 'tools/configure-calculator-passcode.py'
      - 'tools/check-calculator-gate.sh'
      - 'tools/check-calculator-captures.py'
      - 'tools/prepare-adhoc-profiles.py'
      - 'tools/sideload_build_policy.py'
      - 'tools/build-calculator-ipa.sh'
      - 'build-system/*configuration.json'
      - 'build-system/Make/BuildConfiguration.py'
      - 'submodules/BuildConfig/**'
      - 'Telegram/BUILD'
      - 'build-system/Make/Make.py'
      - '.github/workflows/calculator-gate-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-checks:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            submodules/TelegramUI/Sources/CalculatorGate
            submodules/TelegramUI/Sources/AppDelegate.swift
            submodules/AuthorizationUI/Sources/AuthorizationSequencePaymentScreen.swift
            submodules/AuthorizationUI/Sources/AuthorizationSequencePhoneEntryController.swift
            submodules/AuthorizationUI/Sources/AuthorizationSequenceCodeEntryController.swift
            submodules/AuthorizationUI/Sources/AuthorizationSequenceController.swift
            submodules/TelegramIntents/Sources/TelegramIntents.swift
            submodules/TelegramCallsUI/Sources/CallKitIntegration.swift
            submodules/InAppPurchaseManager/Sources/InAppPurchaseManager.swift
            submodules/BotPaymentsUI/Sources/BotCheckoutControllerNode.swift
            submodules/TelegramCore/Sources/Authorization.swift
            submodules/TelegramCore/Sources/Account/Account.swift
            submodules/TelegramCore/Sources/Account/AccountManager.swift
            submodules/TelegramCore/Sources/TelegramEngine/Auth/AuthTransfer.swift
            submodules/SettingsUI/Sources/Privacy and Security/LoginEmailSetupController.swift
            submodules/TelegramUI/Components/Settings/PasskeysScreen/Sources/PasskeysScreen.swift
            Tests/CalculatorGate
            tools/configure-calculator-passcode.py
            tools/check-calculator-gate.sh
            tools/check-calculator-captures.py
            tools/prepare-adhoc-profiles.py
            tools/sideload_build_policy.py
            tools/build-calculator-ipa.sh
            build-system/calculator-configuration.json
            build-system/appstore-configuration.json
            build-system/appcenter-configuration.json
            build-system/template_minimal_development_configuration.json
            build-system/Make/BuildConfiguration.py
            submodules/BuildConfig
            Telegram/BUILD
            build-system/Make/Make.py
            build-system/fake-codesigning
          sparse-checkout-cone-mode: false
      - name: Run calculator quick checks
        run: |
          set -euo pipefail
          xcodebuild -version
          bash tools/check-calculator-gate.sh
      - name: Upload calculator check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculator-gate-check-logs
          path: _杂项/calculator-checks/*/checks.log
          if-no-files-found: warn
