# 手动生成使用临时签名的 IPA，或运行独立入口检查；使用说明见 docs/codemagic.md。
workflows:
  calculator-checks:
    name: Calculator Gate Checks
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      xcode: "27.1"
      vars:
        # 独立检查不依赖 Git 子模块，也不应触发 fork 的相对子模块 URL。
        CM_RECURSIVE_SUBMODULE_INIT: "false"
    scripts:
      - name: Verify pinned Apple toolchain
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          versions = json.loads(Path("versions.json").read_text())
          xcode = subprocess.check_output(["xcodebuild", "-version"], text=True).splitlines()[0].split()[1]
          macos = subprocess.check_output(["sw_vers", "-productVersion"], text=True).strip()
          if xcode != versions["xcode"]:
              raise SystemExit(f"Required Xcode {versions['xcode']}, found {xcode}")
          if macos.split(".")[0] != versions["macos"]:
              raise SystemExit(f"Required macOS major {versions['macos']}, found {macos}")
          print(f"Xcode {xcode}; macOS {macos}")
          PY
          swiftc --version
      - name: Run calculator quick checks
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          bash tools/check-calculator-gate.sh
    artifacts:
      - _杂项/calculator-checks/*/checks.log

  telegram-ipa:
    name: Telegram IPA (ad-hoc signature, no Apple account)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: "27.1"
      vars:
        CM_RECURSIVE_SUBMODULE_INIT: "false"
    cache:
      cache_paths:
        - $HOME/telegram-bazel-cache
    scripts:
      - name: Build and verify complete IPA
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          bash tools/build-calculator-ipa.sh --build-number "$PROJECT_BUILD_NUMBER"
    artifacts:
      - artifacts/Telegram.ipa
      - artifacts/Telegram.ipa.sha256
      - _杂项/ipa-build/*.log
